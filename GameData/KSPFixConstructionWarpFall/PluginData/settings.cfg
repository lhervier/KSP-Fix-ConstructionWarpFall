// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Keeps the physicsless parts of a vessel in place (lights, batteries, small struts, antennas...) when it comes off
// rails while a part is held in EVA construction mode. On stock, holding a part with the Place tool then warping
// time makes them fall through their vessel to the ground, where they stay.
physicslessPartsStayStill = True

// Also removes what the stock code leaves on these parts when the construction panel is closed while a detached part
// is still held: without it, they are kept in place, but no longer collide with their own vessel until the game is
// reloaded. Only read when physicslessPartsStayStill is True.
orphanRigidbodiesRemoved = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line per part kept in place, each
// time its vessel comes off rails.
logLevel = Info
